[package]
name = "lazypost"
version = "0.1.0"
edition = "2024"
description = "A keyboard-driven terminal HTTP client. Postman in a TUI."
readme = "README.md"
license = "MIT"
repository = "https://github.com/aaron-amelink/lazypost"
keywords = ["tui", "http", "ratatui", "postman", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tui-input = "0.15.3"
ratatui-textarea = "0.9"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
chrono = { version = "0.4.44", features = ["serde"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "rustls", "query", "form", "cookies"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
regex = "1.12.3"
once_cell = "1.21.4"
percent-encoding = "2.3.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
